{{- if (gt (.Values.replicaCount | int) 1) }}
apiVersion: "policy/v1"
kind: PodDisruptionBudget
metadata:
  labels:
    {{- include "dextinity-site-preview.labels" . | nindent 4 }}
  name: {{ include "dextinity-site-preview.fullname" . }}
spec:
  selector:
    matchLabels:
      {{- include "dextinity-site-preview.selectorLabels" . | nindent 6 }}
  minAvailable: 1
{{- end }}